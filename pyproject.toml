[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-to-quiz"
version = "0.1.0"
description = "Turn your documents into verified quiz questions — RAG retrieval, evidence-span grounding, and multi-LLM cross-verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cerebras-cloud-sdk>=1.0",
  "fastapi>=0.110",
  "groq>=0.9",
  "numpy>=1.24",
  "pydantic-settings>=2.2",
  "torch>=2.0",
  "transformers>=4.35",
  "uvicorn[standard]>=0.27",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/iqbal-rahmatullah/docs-to-quiz"
Repository = "https://github.com/iqbal-rahmatullah/docs-to-quiz"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uvicorn]
factory = false
